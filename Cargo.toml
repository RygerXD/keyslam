[package]
name = "babysmash-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A stable, cross-platform Rust reimplementation of BabySmash"
license = "MIT"
repository = "https://github.com/RygerXD/babysmash"

[dependencies]
atomic-write-file = "0.3.0"
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
display-info = "0.5.9"
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
include_dir = "0.7.4"
rand = "0.9.2"
rodio = { version = "0.22.2", default-features = false, features = ["wav"] }
ruopus = { version = "0.1.2", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
single-instance = "0.3.3"
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
